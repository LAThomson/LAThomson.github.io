<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-UK' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var t = stored || (prefersDark ? 'forest' : 'warm');
        document.documentElement.classList.add('theme-' + t);
      })();
    </script>

    <title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">
    <meta property="og:title" content="{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">

    {% include head-custom.html %}
    <script src="{{ '/assets/js/theme-cycle.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    <script src="{{ '/assets/js/lightbox.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    <script src="{{ '/assets/js/external-links.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    <script src="{{ '/assets/js/clock.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </head>
  <body>
    <div class="wrapper">
      <header>
        {% if site.picture %}
          <img src="{{ site.picture }}" alt="A headshot I had taken while participating in MATS 9.0" />
        {% endif %}

        <h1><a href="{{ '/' | absolute_url }}">{{ site.title }}</a><button class="clock-toggle" type="button" aria-label="Toggle clock"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5 V8 L10.5 9.5"/></svg></button></h1>

        <div class="clock-display" hidden></div>

        <p>{{ site.tagline }}</p>

        {% include nav.html %}

        {% include sidebar-links.html %}
      </header>
      <section>
        {{ content }}
      </section>
    </div>
  </body>
</html>
