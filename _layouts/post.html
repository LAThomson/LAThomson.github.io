---
layout: default
---

<article class="post">
  <h2 class="post-title">{{ page.title }}</h2>
  <p class="post-date">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
  </p>

  {{ content }}

  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">← back to blog</a></p>
</article>
